# Core CRM — nginx karşılığı (Caddy kullanmıyorsan).
# Caddy'den farkı: TLS sertifikasını sen yönetirsin (certbot vb.).
#
# Sınır tek yol öneki:
#   /api/v1/messaging/  → apps/messaging (8081)
#   diğer her şey       → apps/api       (8080)

upstream core_api {
    server api:8080;
    keepalive 32;
}

upstream core_messaging {
    server messaging:8081;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name crm.example.com;

    ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;

    # Webhook gövdeleri küçük; medya yüklemesi api tarafında.
    client_max_body_size 25m;

    # Ortak vekil başlıkları. `trust proxy` her iki serviste production'da açık
    # (packages/nest-kernel setupApp), bu başlıklar olmadan istemci IP'si
    # vekilin IP'si görünür.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # ── probe'lar dışarı kapalı ──────────────────────────────────────────
    # /health ve /health/ready orkestratöre aittir; konteynere doğrudan
    # (8080/8081) sorulur. Dışarıya açık kalırsa hangi altyapı bileşeninin
    # düştüğü kimlik doğrulamasız okunabilir.
    location /health {
        return 404;
    }

    # ── messaging servisi ────────────────────────────────────────────────
    # Tek konum bloğu bütün messaging yüzeyini karşılar (webhook'lar + klinik
    # kanal uçları); rotaların hepsi `messaging` öneki altında.
    location /api/v1/messaging/ {
        proxy_pass http://core_messaging;

        # Meta/WhatsApp imzası ham gövde üzerinden HMAC'lenir. Gövdeyi
        # değiştiren hiçbir yönerge (sub_filter vb.) buraya girmemeli.
        proxy_request_buffering on;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── core api ─────────────────────────────────────────────────────────
    location / {
        proxy_pass http://core_api;

        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
    }
}

server {
    listen 80;
    server_name crm.example.com;
    return 301 https://$host$request_uri;
}
